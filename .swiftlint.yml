# SwiftLint — HanziWidget
# Docs: https://realm.github.io/SwiftLint/
# Uso: swiftlint          (na raiz do projeto)
#      swiftlint --fix    (autocorreção)

included:
  - HanziWidget
  - HanziWidgetExtension

excluded:
  - HanziWidget.xcodeproj
  - .git

disabled_rules:
  - trailing_whitespace
  - line_length
  - type_body_length
  - file_length
  - function_body_length
  - cyclomatic_complexity
  - large_tuple
  - todo
  - force_cast
  - identifier_name

opt_in_rules:
  - empty_count
  - empty_string
  - first_where
  - last_where
  - sorted_imports
  - toggle_bool
  - redundant_nil_coalescing
  - redundant_optional_initialization
  - redundant_string_enum_value
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces

custom_rules:
  empty_todo:
    name: "TODO/FIXME sem descrição"
    regex: "(FIXME|TODO):?\\s*$"
    severity: warning
    match_kinds:
      - comment
